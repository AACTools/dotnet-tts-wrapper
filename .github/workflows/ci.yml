name: Build, Test, and Pack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/DotNetTtsWrapper.Core/DotNetTtsWrapper.Core.csproj --configuration Release --no-build -o artifacts

      - name: Upload package
        uses: actions/upload-artifact@v5
        with:
          name: nuget-package
          path: artifacts/*.nupkg
